<div class="plan-card">
  <div class="plan-card__header">
    <div class="plan-card__info">
      <span class="plan-card__name">{{ planName }}</span>
      <span class="plan-card__type">{{ planType }}</span>
    </div>
    <span class="plan-card__amount" [ngClass]="'plan-card__amount--' + accentColor">{{ currentAmount }}</span>
  </div>
  <div class="plan-card__progress">
    <div class="plan-card__progress-header">
      <span class="plan-card__goal">Goal: {{ goalAmount }}</span>
      <span class="plan-card__percent">{{ goalProgress }}%</span>
    </div>
    <div class="plan-card__bar" [ngClass]="'plan-card__bar--' + accentColor">
      <div class="plan-card__fill" [ngClass]="'plan-card__fill--' + accentColor" [style.width.%]="goalProgress"></div>
    </div>
  </div>
</div>
