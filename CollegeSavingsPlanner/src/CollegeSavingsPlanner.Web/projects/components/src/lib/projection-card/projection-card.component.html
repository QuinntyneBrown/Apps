<div class="projection-card">
  <div class="projection-card__header">
    <span class="projection-card__name">{{ planName }}</span>
    <span class="projection-card__beneficiary">{{ beneficiaryName }}</span>
  </div>
  <div class="projection-card__stats" *ngIf="stats.length">
    <div *ngFor="let stat of stats" class="projection-card__stat">
      <span class="projection-card__stat-value">{{ stat.value }}</span>
      <span class="projection-card__stat-label">{{ stat.label }}</span>
    </div>
  </div>
  <div class="projection-card__progress" *ngIf="progressLabel">
    <div class="projection-card__progress-header">
      <span>{{ progressLabel }}</span>
      <span>{{ progressPercent }}%</span>
    </div>
    <div class="projection-card__bar">
      <div class="projection-card__fill" [style.width.%]="progressPercent"></div>
    </div>
  </div>
  <div class="projection-card__recommendation" *ngIf="recommendation">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="16" x2="12" y2="12"/>
      <line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
    <span>{{ recommendation }}</span>
  </div>
</div>
