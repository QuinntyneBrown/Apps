<div class="nav-shell">
  <aside class="nav-shell__sidebar">
    <div class="nav-shell__logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
      <span class="nav-shell__app-name">{{ appName }}</span>
    </div>
    <nav class="nav-shell__nav">
      <a *ngFor="let item of navItems"
         class="nav-shell__nav-item"
         [class.nav-shell__nav-item--active]="item.active"
         [attr.href]="item.route">
        <svg class="nav-shell__nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <ng-container [ngSwitch]="item.icon">
            <ng-container *ngSwitchCase="'home'">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </ng-container>
            <ng-container *ngSwitchCase="'plans'">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </ng-container>
            <ng-container *ngSwitchCase="'kids'">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </ng-container>
            <ng-container *ngSwitchCase="'projections'">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </ng-container>
            <ng-container *ngSwitchDefault>
              <circle cx="12" cy="12" r="10"/>
            </ng-container>
          </ng-container>
        </svg>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <main class="nav-shell__content">
    <ng-content></ng-content>
  </main>

  <nav class="nav-shell__tabbar">
    <a *ngFor="let item of navItems"
       class="nav-shell__tab"
       [class.nav-shell__tab--active]="item.active"
       [attr.href]="item.route">
      <svg class="nav-shell__tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <ng-container [ngSwitch]="item.icon">
          <ng-container *ngSwitchCase="'home'">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </ng-container>
          <ng-container *ngSwitchCase="'plans'">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </ng-container>
          <ng-container *ngSwitchCase="'kids'">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </ng-container>
          <ng-container *ngSwitchCase="'projections'">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </ng-container>
          <ng-container *ngSwitchDefault>
            <circle cx="12" cy="12" r="10"/>
          </ng-container>
        </ng-container>
      </svg>
      <span class="nav-shell__tab-label">{{ item.label }}</span>
    </a>
  </nav>
</div>
