<div class="beneficiary-card">
  <div class="beneficiary-card__top">
    <div class="beneficiary-card__avatar">{{ displayInitial }}</div>
    <div class="beneficiary-card__info">
      <span class="beneficiary-card__name">{{ name }}</span>
      <span class="beneficiary-card__age">{{ age }}</span>
    </div>
  </div>
  <div class="beneficiary-card__stats" *ngIf="stats.length">
    <div *ngFor="let stat of stats" class="beneficiary-card__stat">
      <span class="beneficiary-card__stat-value">{{ stat.value }}</span>
      <span class="beneficiary-card__stat-label">{{ stat.label }}</span>
    </div>
  </div>
</div>
