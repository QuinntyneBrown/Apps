<div class="savings-hero-card">
  <span class="savings-hero-card__label">{{ label }}</span>
  <span class="savings-hero-card__amount">{{ totalSavings }}</span>
  <div class="savings-hero-card__growth" *ngIf="growthPercent">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A5D6A7" stroke-width="2">
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
      <polyline points="17 6 23 6 23 12"/>
    </svg>
    <span>{{ growthPercent }}</span>
  </div>
  <div class="savings-hero-card__goal" *ngIf="goalAmount">
    <div class="savings-hero-card__goal-header">
      <span>Goal: {{ goalAmount }}</span>
      <span>{{ goalProgress }}%</span>
    </div>
    <div class="savings-hero-card__bar">
      <div class="savings-hero-card__fill" [style.width.%]="goalProgress"></div>
    </div>
  </div>
</div>
