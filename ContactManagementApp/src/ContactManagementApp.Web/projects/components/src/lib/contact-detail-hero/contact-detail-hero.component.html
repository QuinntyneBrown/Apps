<div class="contact-detail-hero">
  <div class="contact-detail-hero__profile">
    <div class="contact-detail-hero__avatar" [ngClass]="'contact-detail-hero__avatar--' + avatarColor">
      <span class="contact-detail-hero__initials">{{ initials }}</span>
    </div>
    <h2 class="contact-detail-hero__name">{{ name }}</h2>
    <span class="contact-detail-hero__role">{{ role }}</span>
    <div *ngIf="badges.length" class="contact-detail-hero__badges">
      <span *ngFor="let badge of badges" class="contact-detail-hero__badge" [ngClass]="'contact-detail-hero__badge--' + badge.color">
        {{ badge.label }}
      </span>
    </div>
  </div>

  <div *ngIf="infoRows.length" class="contact-detail-hero__info">
    <div *ngFor="let row of infoRows" class="contact-detail-hero__row">
      <span class="contact-detail-hero__row-text" [ngClass]="{ 'contact-detail-hero__row-text--link': row.isLink }">
        {{ row.text }}
      </span>
    </div>
  </div>

  <div class="contact-detail-hero__actions">
    <button class="contact-detail-hero__action contact-detail-hero__action--primary" (click)="onLogInteraction()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Log Interaction
    </button>
    <button class="contact-detail-hero__action contact-detail-hero__action--accent" (click)="onAddFollowUp()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      Add Follow-up
    </button>
  </div>
</div>
