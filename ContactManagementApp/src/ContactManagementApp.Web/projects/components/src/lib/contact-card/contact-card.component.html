<div class="contact-card">
  <div class="contact-card__top">
    <div class="contact-card__avatar" [ngClass]="'contact-card__avatar--' + avatarColor">
      <span class="contact-card__initials">{{ initials }}</span>
    </div>
    <div class="contact-card__info">
      <span class="contact-card__name">{{ name }}</span>
      <span class="contact-card__role">{{ role }}</span>
    </div>
  </div>
  <div *ngIf="badges.length" class="contact-card__badges">
    <span *ngFor="let badge of badges" class="contact-card__badge" [ngClass]="'contact-card__badge--' + badge.color">
      {{ badge.label }}
    </span>
  </div>
</div>
