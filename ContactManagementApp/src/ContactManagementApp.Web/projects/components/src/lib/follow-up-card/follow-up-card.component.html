<div class="follow-up-card">
  <div class="follow-up-card__top">
    <span class="follow-up-card__title">{{ title }}</span>
    <span *ngIf="priorityLabel" class="follow-up-card__badge" [ngClass]="'follow-up-card__badge--' + priorityColor">
      {{ priorityLabel }}
    </span>
  </div>
  <p class="follow-up-card__desc">{{ description }}</p>
  <span class="follow-up-card__date" [ngClass]="{ 'follow-up-card__date--overdue': overdue }">{{ dueDate }}</span>
</div>
