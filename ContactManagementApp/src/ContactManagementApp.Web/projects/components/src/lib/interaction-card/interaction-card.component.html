<div class="interaction-card">
  <div class="interaction-card__top">
    <span class="interaction-card__title">{{ title }}</span>
    <span *ngIf="badgeLabel" class="interaction-card__badge" [ngClass]="'interaction-card__badge--' + badgeColor">
      {{ badgeLabel }}
    </span>
  </div>
  <p class="interaction-card__desc">{{ description }}</p>
  <div class="interaction-card__meta">
    <span class="interaction-card__date">{{ date }}</span>
    <span *ngIf="duration" class="interaction-card__duration">{{ duration }}</span>
  </div>
</div>
