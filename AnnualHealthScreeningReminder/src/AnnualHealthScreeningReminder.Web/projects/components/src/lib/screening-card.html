<div class="screening-card" (click)="cardClick.emit()">
  <div class="screening-card__icon" [ngClass]="'screening-card__icon--' + statusColor">
    <span class="material-symbols-rounded">{{ icon }}</span>
  </div>
  <div class="screening-card__content">
    <span class="screening-card__name">{{ name }}</span>
    <span class="screening-card__date" [ngClass]="'screening-card__date--' + statusColor">{{ dateLabel }}</span>
  </div>
  <span *ngIf="showChevron" class="material-symbols-rounded screening-card__chevron">chevron_right</span>
</div>
