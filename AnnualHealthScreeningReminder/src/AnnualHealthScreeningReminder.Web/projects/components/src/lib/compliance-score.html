<div class="compliance-score">
  <div class="compliance-score__top">
    <span class="compliance-score__label">Compliance Score</span>
    <span class="compliance-score__badge" [ngClass]="'compliance-score__badge--' + status">
      {{ statusLabel }}
    </span>
  </div>
  <span class="compliance-score__value">{{ score }}%</span>
  <div class="compliance-score__bar">
    <div class="compliance-score__bar-fill" [style.width.%]="score"></div>
  </div>
  <span class="compliance-score__subtitle">{{ completed }} of {{ total }} screenings completed this year</span>
</div>
