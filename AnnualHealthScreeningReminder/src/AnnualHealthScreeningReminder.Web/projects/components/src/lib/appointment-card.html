<div class="appointment-card" [class.appointment-card--highlighted]="highlighted" (click)="cardClick.emit()">
  <div class="appointment-card__top">
    <span class="appointment-card__title">{{ title }}</span>
    <span *ngIf="badgeText" class="appointment-card__badge">{{ badgeText }}</span>
  </div>
  <div class="appointment-card__details">
    <div *ngFor="let detail of details" class="appointment-card__detail">
      <span class="material-symbols-rounded appointment-card__detail-icon">{{ detail.icon }}</span>
      <span class="appointment-card__detail-text">{{ detail.text }}</span>
    </div>
  </div>
</div>
