<div class="hero-banner">
  <span class="hero-banner__greeting">{{ greeting }}</span>
  <h2 class="hero-banner__date">{{ date }}</h2>
  <div *ngIf="streakCount > 0" class="hero-banner__streak">
    <svg class="hero-banner__fire" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 23c-4.97 0-9-3.58-9-8 0-3.07 2.14-6.09 4-7.87V4l3.32 2.49C11.76 4.93 13.46 3 14.5 2c.35 1.5.9 3 2 4.5 1.1 1.5 2.5 3 3 5 .5 2 .5 4-1 6s-3.5 3.5-6.5 5.5z"/>
    </svg>
    <span class="hero-banner__streak-text">{{ streakCount }} {{ streakLabel }}</span>
  </div>
</div>
