<div class="mood-bar">
  <span class="mood-bar__label">{{ label }}</span>
  <div class="mood-bar__track" [style.background]="barColor">
    <div class="mood-bar__fill" [style.width.%]="percentage" [style.background]="fillColor"></div>
  </div>
  <span class="mood-bar__pct">{{ percentage }}%</span>
</div>
