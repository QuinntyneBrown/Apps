<div class="page-header">
  <div class="page-header__left">
    <button *ngIf="showBack" class="page-header__back" (click)="onBack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <h1 class="page-header__title">{{ title }}</h1>
  </div>
  <button *ngIf="actionLabel" class="page-header__action" (click)="onAction()">
    <span *ngIf="actionIcon" class="page-header__action-icon material-symbols-rounded">{{ actionIcon }}</span>
    {{ actionLabel }}
  </button>
</div>
