<div class="daily-prompt-hero">
  <svg class="daily-prompt-hero__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
  </svg>
  <p class="daily-prompt-hero__text">{{ prompt }}</p>
  <div class="daily-prompt-hero__bottom">
    <span *ngIf="category" class="daily-prompt-hero__category">{{ category }}</span>
    <button class="daily-prompt-hero__btn" (click)="startWriting.emit()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Start Writing
    </button>
  </div>
</div>
