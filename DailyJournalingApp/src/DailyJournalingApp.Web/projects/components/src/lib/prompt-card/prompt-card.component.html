<div class="prompt-card" (click)="cardClick.emit()">
  <p class="prompt-card__text">{{ text }}</p>
  <div class="prompt-card__bottom">
    <span *ngIf="category" class="prompt-card__category" [style.background]="categoryColor">{{ category }}</span>
    <span class="prompt-card__spacer"></span>
    <span *ngIf="responseCount" class="prompt-card__count">{{ responseCount }}</span>
  </div>
</div>
