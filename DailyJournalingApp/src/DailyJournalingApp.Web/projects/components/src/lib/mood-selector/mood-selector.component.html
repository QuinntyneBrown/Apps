<div class="mood-selector">
  <div
    *ngFor="let mood of moods"
    class="mood-selector__option"
    [class.mood-selector__option--selected]="mood.label === selectedMood"
    [style.background]="mood.color"
    (click)="onSelect(mood)"
  >
    <span class="mood-selector__emoji">{{ mood.emoji }}</span>
    <span class="mood-selector__label" [class.mood-selector__label--selected]="mood.label === selectedMood">{{ mood.label }}</span>
  </div>
</div>
