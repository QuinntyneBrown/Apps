<div class="book-item">
  <div class="book-item__cover" [style.background]="coverColor">
    <span class="book-item__cover-icon material-symbols-rounded">{{ coverIcon }}</span>
  </div>
  <div class="book-item__info">
    <span class="book-item__title">{{ title }}</span>
    <span class="book-item__author">{{ author }}</span>
    <span *ngIf="pages || genre" class="book-item__meta">{{ pages }}<ng-container *ngIf="pages && genre">  &bull;  </ng-container>{{ genre }}</span>
  </div>
</div>
