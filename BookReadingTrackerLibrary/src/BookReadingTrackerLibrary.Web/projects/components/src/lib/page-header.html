<div class="page-header">
  <button class="page-header__back" (click)="back.emit()">
    <span class="material-symbols-rounded">arrow_back</span>
  </button>
  <span class="page-header__title">{{ title }}</span>
  <button *ngIf="showMore" class="page-header__more" (click)="more.emit()">
    <span class="material-symbols-rounded">more_vert</span>
  </button>
  <div *ngIf="!showMore" class="page-header__spacer"></div>
</div>
