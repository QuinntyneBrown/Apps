<div class="goal-card" [ngClass]="'goal-card--' + variant">
  <div class="goal-card__head">
    <span class="goal-card__title">{{ title }}</span>
    <span class="goal-card__count">{{ current }}/{{ target }} books</span>
  </div>
  <div class="goal-card__bar">
    <div class="goal-card__bar-fill" [style.width.%]="progress"></div>
  </div>
  <div class="goal-card__footer">
    <span class="goal-card__pct">{{ progress }}% complete</span>
    <span *ngIf="description" class="goal-card__desc">{{ description }}</span>
  </div>
</div>
