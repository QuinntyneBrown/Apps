<div class="progress-card">
  <div class="progress-card__top">
    <div class="progress-card__cover" [style.background]="coverColor">
      <span class="progress-card__cover-icon material-symbols-rounded">{{ coverIcon }}</span>
    </div>
    <div class="progress-card__info">
      <span class="progress-card__title">{{ title }}</span>
      <span class="progress-card__author">{{ author }}</span>
    </div>
  </div>
  <div class="progress-card__prog">
    <div class="progress-card__bar-head">
      <span class="progress-card__pct">{{ progress }}%</span>
      <span *ngIf="totalPages" class="progress-card__pages">{{ currentPage }}/{{ totalPages }} pages</span>
    </div>
    <div class="progress-card__bar">
      <div class="progress-card__bar-fill" [style.width.%]="progress"></div>
    </div>
  </div>
  <button class="progress-card__btn" (click)="continueReading.emit()">Continue Reading</button>
</div>
