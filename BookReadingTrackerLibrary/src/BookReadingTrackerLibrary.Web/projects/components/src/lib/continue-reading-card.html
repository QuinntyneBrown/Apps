<div class="reading-card">
  <span class="reading-card__label">Continue Reading</span>
  <div class="reading-card__book">
    <div class="reading-card__cover">
      <span class="reading-card__cover-icon material-symbols-rounded">{{ coverIcon }}</span>
    </div>
    <div class="reading-card__info">
      <span class="reading-card__title">{{ title }}</span>
      <span class="reading-card__author">{{ author }}</span>
      <div class="reading-card__progress">
        <div class="reading-card__bar">
          <div class="reading-card__bar-fill" [style.width.%]="progress"></div>
        </div>
        <span class="reading-card__pct">{{ progress }}%</span>
      </div>
    </div>
  </div>
</div>
