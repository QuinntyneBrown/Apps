<div class="claim-card" (click)="cardClick.emit()">
  <div class="claim-card__top">
    <h4 class="claim-card__title">{{ title }}</h4>
    <span *ngIf="status" class="claim-card__badge" [style.color]="statusColor" [style.background]="statusBackground">{{ status }}</span>
  </div>
  <div class="claim-card__details">
    <span *ngIf="metaText" class="claim-card__meta">{{ metaText }}</span>
    <span class="claim-card__amount">{{ amount }}</span>
  </div>
  <span *ngIf="date" class="claim-card__date" [style.color]="dateColor">{{ date }}</span>
</div>
