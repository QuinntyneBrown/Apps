<div class="hero-banner">
  <span class="hero-banner__greeting">{{ greeting }}</span>
  <h2 class="hero-banner__amount">{{ amount }}</h2>
  <span *ngIf="subtitle" class="hero-banner__subtitle">{{ subtitle }}</span>
  <button *ngIf="actionLabel" class="hero-banner__btn" (click)="action.emit()">
    <span class="hero-banner__btn-icon material-symbols-rounded">add</span>
    {{ actionLabel }}
  </button>
</div>
