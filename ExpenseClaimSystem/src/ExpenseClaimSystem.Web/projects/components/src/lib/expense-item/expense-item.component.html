<div class="expense-item" (click)="itemClick.emit()">
  <div class="expense-item__icon" [style.background]="iconBackground">
    <span class="expense-item__icon-symbol material-symbols-rounded">{{ icon }}</span>
  </div>
  <div class="expense-item__info">
    <h4 class="expense-item__title">{{ title }}</h4>
    <span *ngIf="metaText" class="expense-item__meta">{{ metaText }}</span>
  </div>
  <span class="expense-item__amount">{{ amount }}</span>
</div>
