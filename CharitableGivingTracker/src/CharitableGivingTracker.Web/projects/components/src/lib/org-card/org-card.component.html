<div class="org-card">
  <div class="org-card__top">
    <div class="org-card__avatar">{{ displayInitial }}</div>
    <div class="org-card__info">
      <span class="org-card__name">{{ name }}</span>
      <span class="org-card__category">{{ category }}</span>
    </div>
  </div>
  <div class="org-card__bottom" *ngIf="totalDonated">
    <span class="org-card__donated">{{ totalDonated }} donated</span>
    <span class="org-card__count" *ngIf="donationCount">{{ donationCount }} {{ donationCount === 1 ? 'donation' : 'donations' }}</span>
  </div>
</div>
