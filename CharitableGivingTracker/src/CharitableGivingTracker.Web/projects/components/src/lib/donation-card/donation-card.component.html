<div class="donation-card">
  <div class="donation-card__left">
    <span class="donation-card__org">{{ organizationName }}</span>
    <span class="donation-card__meta">{{ date }} &middot; {{ method }}</span>
  </div>
  <div class="donation-card__right">
    <span class="donation-card__amount">{{ amount }}</span>
    <span class="donation-card__status" [ngClass]="'donation-card__status--' + status.toLowerCase()">{{ status }}</span>
  </div>
</div>
