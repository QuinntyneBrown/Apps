<div class="tax-summary-card">
  <span class="tax-summary-card__title">Tax Year {{ year }} Summary</span>
  <div class="tax-summary-card__row">
    <div class="tax-summary-card__stat">
      <span class="tax-summary-card__stat-value">{{ totalDonated }}</span>
      <span class="tax-summary-card__stat-label">Total Donated</span>
    </div>
    <div class="tax-summary-card__stat">
      <span class="tax-summary-card__stat-value">{{ taxDeductible }}</span>
      <span class="tax-summary-card__stat-label">Tax Deductible</span>
    </div>
  </div>
  <div class="tax-summary-card__bar">
    <div class="tax-summary-card__bar-fill" [style.width.%]="deductiblePercentage"></div>
  </div>
  <span class="tax-summary-card__note">{{ deductiblePercentage }}% of donations are tax deductible</span>
</div>
