<div class="giving-hero-card">
  <span class="giving-hero-card__label">{{ label }}</span>
  <span class="giving-hero-card__amount">{{ amount }}</span>
  <div class="giving-hero-card__stats" *ngIf="stats.length">
    <div *ngFor="let stat of stats" class="giving-hero-card__stat">
      <span class="giving-hero-card__stat-value">{{ stat.value }}</span>
      <span class="giving-hero-card__stat-label">{{ stat.label }}</span>
    </div>
  </div>
</div>
