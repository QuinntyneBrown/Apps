<div class="nav-shell">
  <!-- Desktop Sidebar -->
  <aside class="nav-shell__sidebar">
    <div class="nav-shell__logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="nav-shell__app-name">{{ appName }}</span>
    </div>
    <nav class="nav-shell__nav">
      <a *ngFor="let item of navItems"
         class="nav-shell__nav-item"
         [class.nav-shell__nav-item--active]="item.active"
         [attr.href]="item.route">
        <svg class="nav-shell__nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <ng-container [ngSwitch]="item.icon">
            <ng-container *ngSwitchCase="'home'">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </ng-container>
            <ng-container *ngSwitchCase="'donate'">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </ng-container>
            <ng-container *ngSwitchCase="'orgs'">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </ng-container>
            <ng-container *ngSwitchCase="'tax'">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </ng-container>
            <ng-container *ngSwitchDefault>
              <circle cx="12" cy="12" r="10"/>
            </ng-container>
          </ng-container>
        </svg>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="nav-shell__content">
    <ng-content></ng-content>
  </main>

  <!-- Mobile Tab Bar -->
  <nav class="nav-shell__tabbar">
    <a *ngFor="let item of navItems"
       class="nav-shell__tab"
       [class.nav-shell__tab--active]="item.active"
       [attr.href]="item.route">
      <svg class="nav-shell__tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <ng-container [ngSwitch]="item.icon">
          <ng-container *ngSwitchCase="'home'">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </ng-container>
          <ng-container *ngSwitchCase="'donate'">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </ng-container>
          <ng-container *ngSwitchCase="'orgs'">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </ng-container>
          <ng-container *ngSwitchCase="'tax'">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </ng-container>
          <ng-container *ngSwitchDefault>
            <circle cx="12" cy="12" r="10"/>
          </ng-container>
        </ng-container>
      </svg>
      <span class="nav-shell__tab-label">{{ item.label }}</span>
    </a>
  </nav>
</div>
