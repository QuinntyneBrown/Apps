<div class="goal-progress-card">
  <div class="goal-progress-card__header">
    <span class="goal-progress-card__title">{{ title }}</span>
    <span class="goal-progress-card__values">{{ current }} / {{ goal }}</span>
  </div>
  <div class="goal-progress-card__bar">
    <div class="goal-progress-card__fill" [style.width.%]="percentage"></div>
  </div>
  <span class="goal-progress-card__label">{{ percentage }}% of goal reached</span>
</div>
