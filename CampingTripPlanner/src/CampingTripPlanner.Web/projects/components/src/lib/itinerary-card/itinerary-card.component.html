<div class="itinerary-card">
  <div class="itinerary-card__header">
    <span class="itinerary-card__day">Day {{ day.dayNumber }}</span>
    <span class="itinerary-card__date">{{ day.date }}</span>
  </div>
  <ul class="itinerary-card__activities">
    <li *ngFor="let activity of day.activities" class="itinerary-card__activity">
      <span class="itinerary-card__bullet"></span>
      <span>{{ activity }}</span>
    </li>
  </ul>
</div>
