<div class="trip-card">
  <div class="trip-card__icon" [style.background]="iconColor">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
      <path d="M3 18l6-6 4 4 8-8"/>
      <path d="M17 6h4v4"/>
    </svg>
  </div>
  <div class="trip-card__content">
    <span class="trip-card__name">{{ tripName }}</span>
    <div class="trip-card__meta">
      <span>{{ dateRange }}</span>
      <span class="trip-card__separator">&middot;</span>
      <span>{{ peopleCount }} {{ peopleCount === 1 ? 'person' : 'people' }}</span>
    </div>
  </div>
  <span class="trip-card__status" [ngClass]="'trip-card__status--' + status.toLowerCase()">{{ status }}</span>
</div>
