<div class="campsite-card">
  <div class="campsite-card__header">
    <h3 class="campsite-card__name">{{ name }}</h3>
    <div class="campsite-card__location">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>{{ location }}</span>
    </div>
  </div>
  <div class="campsite-card__amenities" *ngIf="amenities.length">
    <span class="campsite-card__amenities-label">Amenities</span>
    <div class="campsite-card__amenities-grid">
      <span *ngFor="let amenity of amenities" class="campsite-card__amenity">{{ amenity }}</span>
    </div>
  </div>
  <div class="campsite-card__reservation" *ngIf="reservationStatus">
    <div class="campsite-card__reservation-row">
      <span class="campsite-card__reservation-label">Reservation</span>
      <span class="campsite-card__reservation-status">{{ reservationStatus }}</span>
    </div>
    <span class="campsite-card__reservation-date" *ngIf="reservationDate">{{ reservationDate }}</span>
  </div>
</div>
