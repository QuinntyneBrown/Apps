<div class="packing-item" [class.packing-item--checked]="checked" (click)="toggle()">
  <div class="packing-item__checkbox">
    <svg *ngIf="checked" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <span class="packing-item__name">{{ name }}</span>
  <span class="packing-item__weight">{{ weight }}</span>
</div>
