<div class="trip-hero-card">
  <span class="trip-hero-card__label">{{ label }}</span>
  <h2 class="trip-hero-card__name">{{ tripName }}</h2>
  <div class="trip-hero-card__details">
    <div class="trip-hero-card__detail">
      <svg class="trip-hero-card__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>{{ dateRange }}</span>
    </div>
    <div class="trip-hero-card__detail">
      <svg class="trip-hero-card__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>{{ peopleCount }} {{ peopleCount === 1 ? 'person' : 'people' }}</span>
    </div>
  </div>
  <div class="trip-hero-card__progress">
    <div class="trip-hero-card__progress-header">
      <span class="trip-hero-card__progress-label">Packing Progress</span>
      <span class="trip-hero-card__progress-value">{{ packingProgress }}%</span>
    </div>
    <div class="trip-hero-card__progress-bar">
      <div class="trip-hero-card__progress-fill" [style.width.%]="packingProgress"></div>
    </div>
  </div>
</div>
