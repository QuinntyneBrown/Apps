<div class="upcoming-date-card" (click)="cardClick.emit()">
  <div class="upcoming-date-card__date">
    <span class="upcoming-date-card__day-label">{{ dayLabel }}</span>
    <span class="upcoming-date-card__day-number">{{ dayNumber }}</span>
  </div>
  <div class="upcoming-date-card__info">
    <h4 class="upcoming-date-card__title">{{ title }}</h4>
    <span *ngIf="details" class="upcoming-date-card__details">{{ details }}</span>
  </div>
</div>
