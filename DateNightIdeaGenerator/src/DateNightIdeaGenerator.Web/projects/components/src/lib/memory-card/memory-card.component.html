<div class="memory-card" (click)="cardClick.emit()">
  <div class="memory-card__icon" [style.background]="emojiBackground">
    <span class="memory-card__emoji">{{ emoji }}</span>
  </div>
  <div class="memory-card__info">
    <h4 class="memory-card__title">{{ title }}</h4>
    <div class="memory-card__meta">
      <span *ngIf="date" class="memory-card__date">{{ date }}</span>
      <span *ngIf="rating" class="memory-card__rating">{{ rating }}</span>
      <span *ngIf="cost" class="memory-card__cost">{{ cost }}</span>
    </div>
  </div>
</div>
