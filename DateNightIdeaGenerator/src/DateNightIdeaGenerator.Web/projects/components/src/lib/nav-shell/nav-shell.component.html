<div class="nav-shell">
  <!-- Desktop Sidebar -->
  <aside class="nav-shell__sidebar">
    <div class="nav-shell__logo">
      <span class="nav-shell__logo-icon material-symbols-rounded">favorite</span>
      <span class="nav-shell__logo-text">DateNight</span>
    </div>
    <nav class="nav-shell__nav">
      <a
        *ngFor="let link of sidebarLinks"
        class="nav-shell__link"
        [class.nav-shell__link--active]="activeRoute === link.route"
        (click)="onNavigate(link.route)"
      >
        <span class="nav-shell__link-icon material-symbols-rounded">{{ link.icon }}</span>
        {{ link.label }}
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="nav-shell__content">
    <ng-content></ng-content>
  </main>

  <!-- Mobile Tab Bar -->
  <nav class="nav-shell__tabs">
    <a
      *ngFor="let tab of tabLinks"
      class="nav-shell__tab"
      [class.nav-shell__tab--active]="activeRoute === tab.route"
      (click)="onNavigate(tab.route)"
    >
      <span class="nav-shell__tab-icon material-symbols-rounded">{{ tab.icon }}</span>
      <span class="nav-shell__tab-label">{{ tab.label }}</span>
    </a>
  </nav>
</div>
