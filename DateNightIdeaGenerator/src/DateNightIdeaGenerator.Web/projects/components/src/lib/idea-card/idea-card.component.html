<div class="idea-card" (click)="cardClick.emit()">
  <div class="idea-card__icon" [style.background]="emojiBackground">
    <span class="idea-card__emoji">{{ emoji }}</span>
  </div>
  <div class="idea-card__info">
    <h4 class="idea-card__title">{{ title }}</h4>
    <div class="idea-card__meta">
      <span *ngIf="category" class="idea-card__category" [style.background]="categoryColor">{{ category }}</span>
      <span *ngIf="cost" class="idea-card__cost">{{ cost }}</span>
    </div>
  </div>
  <button class="idea-card__action" (click)="actionClick.emit(); $event.stopPropagation()">
    <span class="material-symbols-rounded">more_vert</span>
  </button>
</div>
