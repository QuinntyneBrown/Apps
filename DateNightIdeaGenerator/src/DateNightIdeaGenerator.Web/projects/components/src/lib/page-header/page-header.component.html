<div class="page-header">
  <div class="page-header__left">
    <h1 class="page-header__title">{{ title }}</h1>
    <span *ngIf="badge" class="page-header__badge">{{ badge }}</span>
  </div>
  <button *ngIf="actionLabel" class="page-header__action" (click)="action.emit()">
    <span *ngIf="actionIcon" class="page-header__action-icon material-symbols-rounded">{{ actionIcon }}</span>
    {{ actionLabel }}
  </button>
</div>
