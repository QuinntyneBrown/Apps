<div class="next-date-card" (click)="cardClick.emit()">
  <div class="next-date-card__label">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span class="next-date-card__label-text">{{ label }}</span>
  </div>
  <h3 class="next-date-card__title">{{ title }}</h3>
  <div class="next-date-card__details">
    <span *ngIf="time" class="next-date-card__detail">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      {{ time }}
    </span>
    <span *ngIf="cost" class="next-date-card__detail">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      {{ cost }}
    </span>
    <span *ngIf="category" class="next-date-card__category" [style.background]="categoryColor">{{ category }}</span>
  </div>
</div>
