<div class="swiper-card">
  <div class="swiper-card__card">
    <div
      class="swiper-card__image"
      [style.backgroundImage]="imageUrl ? 'url(' + imageUrl + ')' : 'none'"
    ></div>
    <div class="swiper-card__body">
      <h3 class="swiper-card__title">{{ title }}</h3>
      <p class="swiper-card__desc">{{ description }}</p>
      <div class="swiper-card__meta">
        <span *ngIf="time" class="swiper-card__time">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          {{ time }}
        </span>
        <span *ngIf="cost" class="swiper-card__cost">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          {{ cost }}
        </span>
        <span *ngIf="category" class="swiper-card__category" [style.background]="categoryColor">{{ category }}</span>
      </div>
    </div>
  </div>
  <div class="swiper-card__actions">
    <button class="swiper-card__btn swiper-card__btn--skip" (click)="skip.emit()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="swiper-card__btn swiper-card__btn--save" (click)="save.emit()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
    </button>
    <button class="swiper-card__btn swiper-card__btn--love" (click)="love.emit()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
  </div>
</div>
