<div class="settings-card">
  <div class="settings-card__header">
    <span class="material-symbols-rounded settings-card__header-icon"
          [ngClass]="'settings-card__header-icon--' + iconColor">{{ icon }}</span>
    <div class="settings-card__header-text">
      <span class="settings-card__title">{{ title }}</span>
      <span *ngIf="subtitle" class="settings-card__subtitle">{{ subtitle }}</span>
    </div>
  </div>
  <div class="settings-card__divider"></div>
  <div class="settings-card__options">
    <div *ngFor="let option of options" class="settings-card__option">
      <span class="settings-card__option-label">{{ option.label }}</span>
      <span class="settings-card__option-value">{{ option.value }}</span>
    </div>
  </div>
  <ng-content></ng-content>
</div>
