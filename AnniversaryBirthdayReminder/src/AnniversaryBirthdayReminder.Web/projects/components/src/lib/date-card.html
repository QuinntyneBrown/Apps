<div class="date-card"
     [class.date-card--highlighted]="highlighted"
     (click)="cardClick.emit()">
  <div class="date-card__icon" [ngClass]="'date-card__icon--' + iconColor">
    <span class="material-symbols-rounded date-card__icon-glyph">{{ icon }}</span>
  </div>
  <div class="date-card__content">
    <span class="date-card__name">{{ name }}</span>
    <span class="date-card__subtitle">{{ subtitle }}</span>
  </div>
  <div *ngIf="badgeText" class="date-card__badge" [ngClass]="'date-card__badge--' + badgeColor">
    {{ badgeText }}
  </div>
</div>
