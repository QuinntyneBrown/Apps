<div class="budget-tracker">
  <div class="budget-tracker__header">
    <span class="material-symbols-rounded budget-tracker__icon">wallet</span>
    <span class="budget-tracker__title">Budget Tracker</span>
  </div>
  <div class="budget-tracker__stats">
    <div class="budget-tracker__stat">
      <span class="budget-tracker__stat-value">${{ budget }}</span>
      <span class="budget-tracker__stat-label">Budget</span>
    </div>
    <div class="budget-tracker__stat">
      <span class="budget-tracker__stat-value">${{ spent }}</span>
      <span class="budget-tracker__stat-label">Spent</span>
    </div>
    <div class="budget-tracker__stat">
      <span class="budget-tracker__stat-value budget-tracker__stat-value--remaining">${{ remaining }}</span>
      <span class="budget-tracker__stat-label">Left</span>
    </div>
  </div>
  <div class="budget-tracker__progress">
    <div class="budget-tracker__progress-fill" [style.width.%]="progressPercent"></div>
  </div>
</div>
