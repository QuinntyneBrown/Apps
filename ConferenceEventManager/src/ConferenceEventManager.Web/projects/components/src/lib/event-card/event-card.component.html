<div class="event-card" [ngClass]="badges.length ? 'event-card--detailed' : ''">
  <div class="event-card__top">
    <div class="event-card__date" [ngClass]="'event-card__date--' + color">
      <span class="event-card__month">{{ dateMonth }}</span>
      <span class="event-card__day">{{ dateDay }}</span>
    </div>
    <div class="event-card__info">
      <span class="event-card__name">{{ name }}</span>
      <span class="event-card__subtitle">{{ subtitle }}</span>
    </div>
    <svg *ngIf="showArrow" class="event-card__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </div>
  <div *ngIf="badges.length" class="event-card__badges">
    <span *ngFor="let badge of badges" class="event-card__badge" [ngClass]="'event-card__badge--' + badge.color">
      {{ badge.label }}
    </span>
  </div>
</div>
