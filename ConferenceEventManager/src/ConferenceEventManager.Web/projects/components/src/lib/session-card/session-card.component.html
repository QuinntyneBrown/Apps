<div class="session-card">
  <div class="session-card__top">
    <div class="session-card__time" [ngClass]="'session-card__time--' + color">
      <span class="session-card__hour">{{ time }}</span>
      <span class="session-card__period">{{ period }}</span>
    </div>
    <div class="session-card__info">
      <span class="session-card__title">{{ title }}</span>
      <span class="session-card__speaker">{{ speaker }}</span>
    </div>
  </div>
  <div *ngIf="badges.length" class="session-card__badges">
    <span *ngFor="let badge of badges" class="session-card__badge" [ngClass]="'session-card__badge--' + badge.color">
      {{ badge.label }}
    </span>
  </div>
</div>
