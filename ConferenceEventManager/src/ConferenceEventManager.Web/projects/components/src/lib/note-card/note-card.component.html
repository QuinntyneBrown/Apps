<div class="note-card">
  <div class="note-card__top">
    <span class="note-card__title">{{ title }}</span>
    <span *ngIf="badgeLabel" class="note-card__badge" [ngClass]="'note-card__badge--' + badgeColor">
      {{ badgeLabel }}
    </span>
  </div>
  <p class="note-card__body">{{ body }}</p>
  <span class="note-card__date">{{ date }}</span>
</div>
