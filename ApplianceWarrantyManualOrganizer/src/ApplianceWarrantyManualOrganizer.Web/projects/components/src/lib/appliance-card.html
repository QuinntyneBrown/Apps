<div class="appliance-card" (click)="cardClick.emit()">
  <div class="appliance-card__icon" [ngClass]="'appliance-card__icon--' + iconColor">
    <span class="material-symbols-rounded">{{ icon }}</span>
  </div>
  <div class="appliance-card__content">
    <span class="appliance-card__name">{{ name }}</span>
    <span class="appliance-card__subtitle">{{ subtitle }}</span>
  </div>
  <span *ngIf="showChevron" class="material-symbols-rounded appliance-card__chevron">chevron_right</span>
</div>
