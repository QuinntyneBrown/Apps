<div class="alert-card" [ngClass]="'alert-card--' + severity" (click)="cardClick.emit()">
  <span class="material-symbols-rounded alert-card__icon">{{ icon }}</span>
  <div class="alert-card__content">
    <span class="alert-card__title">{{ title }}</span>
    <span class="alert-card__message">{{ message }}</span>
  </div>
</div>
