<div class="warranty-card" (click)="cardClick.emit()">
  <div class="warranty-card__top">
    <span class="warranty-card__name">{{ applianceName }}</span>
    <span class="warranty-card__badge" [ngClass]="'warranty-card__badge--' + status">
      {{ statusLabel }}
    </span>
  </div>
  <span class="warranty-card__provider">{{ provider }}</span>
  <div class="warranty-card__bar">
    <div class="warranty-card__bar-fill"
         [ngClass]="'warranty-card__bar-fill--' + status"
         [style.width.%]="progressPercent"></div>
  </div>
</div>
