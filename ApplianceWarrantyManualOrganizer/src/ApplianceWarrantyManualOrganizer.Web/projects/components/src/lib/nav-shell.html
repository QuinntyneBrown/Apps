<!-- Desktop Sidebar -->
<aside class="nav-shell__sidebar">
  <div class="nav-shell__logo">
    <span class="material-symbols-rounded nav-shell__logo-icon">{{ appIcon }}</span>
    <span class="nav-shell__logo-text">{{ appName }}</span>
  </div>
  <nav class="nav-shell__nav">
    <a *ngFor="let item of navItems"
       class="nav-shell__nav-item"
       [routerLink]="item.route"
       routerLinkActive="nav-shell__nav-item--active">
      <span class="material-symbols-rounded nav-shell__nav-icon">{{ item.icon }}</span>
      <span class="nav-shell__nav-label">{{ item.label }}</span>
    </a>
  </nav>
</aside>

<!-- Main Content -->
<main class="nav-shell__main">
  <ng-content></ng-content>
</main>

<!-- Mobile Tab Bar -->
<nav class="nav-shell__tabbar">
  <a *ngFor="let item of navItems"
     class="nav-shell__tab"
     [routerLink]="item.route"
     routerLinkActive="nav-shell__tab--active">
    <span class="material-symbols-rounded nav-shell__tab-icon">{{ item.icon }}</span>
    <span class="nav-shell__tab-label">{{ item.label }}</span>
  </a>
</nav>
