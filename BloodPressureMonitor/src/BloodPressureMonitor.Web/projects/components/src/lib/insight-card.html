<div class="insight-card" [ngClass]="'insight-card--' + variant">
  <span class="insight-card__icon material-symbols-rounded">{{ icon }}</span>
  <div class="insight-card__info">
    <span class="insight-card__title">{{ title }}</span>
    <span class="insight-card__desc">{{ description }}</span>
  </div>
</div>
