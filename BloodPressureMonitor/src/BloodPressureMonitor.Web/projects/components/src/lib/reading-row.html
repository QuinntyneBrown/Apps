<div class="reading-row">
  <div class="reading-row__indicator" [ngClass]="'reading-row__indicator--' + status"></div>
  <div class="reading-row__info">
    <div class="reading-row__top">
      <span class="reading-row__reading">{{ reading }} mmHg</span>
      <span class="reading-row__pulse">{{ pulse }} BPM</span>
    </div>
    <span class="reading-row__meta">{{ timestamp }}<ng-container *ngIf="context">  &bull;  {{ context }}</ng-container></span>
  </div>
</div>
