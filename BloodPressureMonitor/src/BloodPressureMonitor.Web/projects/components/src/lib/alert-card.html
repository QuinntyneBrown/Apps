<div class="alert-card" [ngClass]="{'alert-card--danger': !acknowledged}">
  <div class="alert-card__top">
    <span class="alert-card__icon material-symbols-rounded" [ngClass]="acknowledged ? 'alert-card__icon--success' : 'alert-card__icon--danger'">
      {{ acknowledged ? 'check_circle' : icon }}
    </span>
    <div class="alert-card__info">
      <span class="alert-card__title">{{ title }}</span>
      <span class="alert-card__time">{{ timestamp }}<ng-container *ngIf="reading">  &bull;  {{ reading }}</ng-container></span>
    </div>
  </div>
  <ng-container *ngIf="!acknowledged && reading">
    <div class="alert-card__reading">
      <span class="alert-card__reading-val">{{ reading }}</span>
      <span *ngIf="pulse" class="alert-card__reading-pulse">{{ pulse }}</span>
    </div>
    <button class="alert-card__btn" (click)="acknowledge.emit()">Acknowledge</button>
  </ng-container>
</div>
