<div class="goal-card">
  <div class="goal-card__target">
    <span class="goal-card__target-label">Target: {{ target }}</span>
    <span class="goal-card__target-pct">{{ progress }}%</span>
  </div>
  <div class="goal-card__bar">
    <div class="goal-card__bar-fill" [style.width.%]="progress"></div>
  </div>
  <span *ngIf="description" class="goal-card__desc">{{ description }}</span>
</div>
