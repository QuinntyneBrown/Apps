<div class="bp-card">
  <div class="bp-card__top">
    <span class="bp-card__label">{{ label }}</span>
    <span class="bp-card__time">{{ timestamp }}</span>
  </div>
  <div class="bp-card__values">
    <span class="bp-card__sys">{{ systolic }}</span>
    <span class="bp-card__slash">/</span>
    <span class="bp-card__dia">{{ diastolic }}</span>
    <span class="bp-card__unit">mmHg</span>
  </div>
  <div class="bp-card__bottom">
    <div class="bp-card__pulse">
      <span class="bp-card__pulse-icon material-symbols-rounded">favorite</span>
      <span class="bp-card__pulse-text">{{ pulse }} BPM</span>
    </div>
    <span class="bp-card__status" [ngClass]="'bp-card__status--' + status">{{ status | titlecase }}</span>
  </div>
</div>
