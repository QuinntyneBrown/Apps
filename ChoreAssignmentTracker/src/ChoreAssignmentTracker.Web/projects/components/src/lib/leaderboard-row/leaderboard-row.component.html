<div class="leaderboard-row" [style.background]="cardBg" [style.border-color]="cardBorder">
  <div class="leaderboard-row__rank" [style.background]="rankColor">
    <span class="leaderboard-row__rank-num">{{ rank }}</span>
  </div>
  <div class="leaderboard-row__info">
    <span class="leaderboard-row__name">{{ name }}</span>
    <span class="leaderboard-row__chores">{{ choresCompleted }} chores completed</span>
  </div>
  <div class="leaderboard-row__points">
    <span class="leaderboard-row__points-value">{{ points }}</span>
    <span class="leaderboard-row__points-label">pts</span>
  </div>
</div>
