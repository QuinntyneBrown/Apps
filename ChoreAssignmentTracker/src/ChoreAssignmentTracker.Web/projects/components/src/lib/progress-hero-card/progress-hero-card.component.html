<div class="progress-hero-card">
  <span class="progress-hero-card__label">{{ label }}</span>
  <div class="progress-hero-card__row">
    <div class="progress-hero-card__left">
      <span class="progress-hero-card__count">{{ completed }} of {{ total }}</span>
      <span class="progress-hero-card__sub">chores completed</span>
    </div>
    <span class="progress-hero-card__percentage">{{ percentage }}%</span>
  </div>
  <div class="progress-hero-card__bar">
    <div class="progress-hero-card__fill" [style.width.%]="percentage"></div>
  </div>
</div>
