<div class="chore-detail-hero-card">
  <h2 class="chore-detail-hero-card__name">{{ choreName }}</h2>
  <div class="chore-detail-hero-card__badges" *ngIf="badges.length">
    <span *ngFor="let badge of badges" class="chore-detail-hero-card__badge">{{ badge }}</span>
  </div>
  <div class="chore-detail-hero-card__stats" *ngIf="stats.length">
    <div *ngFor="let stat of stats" class="chore-detail-hero-card__stat">
      <span class="chore-detail-hero-card__stat-value">{{ stat.value }}</span>
      <span class="chore-detail-hero-card__stat-label">{{ stat.label }}</span>
    </div>
  </div>
</div>
