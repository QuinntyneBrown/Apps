<div class="nav-shell">
  <aside class="nav-shell__sidebar">
    <div class="nav-shell__logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span class="nav-shell__app-name">{{ appName }}</span>
    </div>
    <nav class="nav-shell__nav">
      <a *ngFor="let item of navItems"
         class="nav-shell__nav-item"
         [class.nav-shell__nav-item--active]="item.active"
         [attr.href]="item.route">
        <svg class="nav-shell__nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <ng-container [ngSwitch]="item.icon">
            <ng-container *ngSwitchCase="'home'">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </ng-container>
            <ng-container *ngSwitchCase="'chores'">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </ng-container>
            <ng-container *ngSwitchCase="'board'">
              <path d="M18 20V10"/>
              <path d="M12 20V4"/>
              <path d="M6 20v-6"/>
            </ng-container>
            <ng-container *ngSwitchCase="'rewards'">
              <circle cx="12" cy="8" r="7"/>
              <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
            </ng-container>
            <ng-container *ngSwitchDefault>
              <circle cx="12" cy="12" r="10"/>
            </ng-container>
          </ng-container>
        </svg>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <main class="nav-shell__content">
    <ng-content></ng-content>
  </main>

  <nav class="nav-shell__tabbar">
    <a *ngFor="let item of navItems"
       class="nav-shell__tab"
       [class.nav-shell__tab--active]="item.active"
       [attr.href]="item.route">
      <svg class="nav-shell__tab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <ng-container [ngSwitch]="item.icon">
          <ng-container *ngSwitchCase="'home'">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </ng-container>
          <ng-container *ngSwitchCase="'chores'">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </ng-container>
          <ng-container *ngSwitchCase="'board'">
            <path d="M18 20V10"/>
            <path d="M12 20V4"/>
            <path d="M6 20v-6"/>
          </ng-container>
          <ng-container *ngSwitchCase="'rewards'">
            <circle cx="12" cy="8" r="7"/>
            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
          </ng-container>
          <ng-container *ngSwitchDefault>
            <circle cx="12" cy="12" r="10"/>
          </ng-container>
        </ng-container>
      </svg>
      <span class="nav-shell__tab-label">{{ item.label }}</span>
    </a>
  </nav>
</div>
