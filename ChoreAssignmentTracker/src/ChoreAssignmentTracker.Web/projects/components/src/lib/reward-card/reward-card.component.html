<div class="reward-card">
  <div class="reward-card__icon" [style.background]="iconColor">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/>
      <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/>
      <path d="M18 12a2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0 2 2 2 2 0 0 0 2-2z"/>
    </svg>
  </div>
  <div class="reward-card__info">
    <span class="reward-card__name">{{ name }}</span>
    <span class="reward-card__description">{{ description }}</span>
  </div>
  <button class="reward-card__btn" [class.reward-card__btn--disabled]="!canRedeem" [disabled]="!canRedeem" (click)="onRedeem()">
    {{ pointsCost }} pts
  </button>
</div>
