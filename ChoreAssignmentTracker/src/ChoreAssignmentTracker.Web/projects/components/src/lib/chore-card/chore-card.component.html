<div class="chore-card" [class.chore-card--done]="done">
  <div class="chore-card__icon" [style.background]="done ? 'var(--success, #4CAF50)' : iconColor">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" [attr.stroke]="done ? '#FFFFFF' : 'var(--foreground, #1A1A2E)'" stroke-width="2">
      <ng-container *ngIf="done; else choreIcon">
        <polyline points="20 6 9 17 4 12"/>
      </ng-container>
      <ng-template #choreIcon>
        <circle cx="12" cy="12" r="10"/>
      </ng-template>
    </svg>
  </div>
  <div class="chore-card__info">
    <span class="chore-card__name">{{ name }}</span>
    <div class="chore-card__meta">
      <span>{{ assignee }}</span>
      <span class="chore-card__dot">&middot;</span>
      <span>{{ difficulty }}</span>
      <span class="chore-card__dot">&middot;</span>
      <span *ngIf="!done">{{ duration }}</span>
      <span *ngIf="done">{{ earnedPoints }} pts earned</span>
    </div>
  </div>
  <span class="chore-card__badge" [class.chore-card__badge--done]="done">
    {{ done ? 'Done!' : points + ' pts' }}
  </span>
</div>
