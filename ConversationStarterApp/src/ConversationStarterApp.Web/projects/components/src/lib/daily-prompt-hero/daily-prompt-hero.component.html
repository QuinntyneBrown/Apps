<div class="daily-prompt-hero">
  <span class="daily-prompt-hero__label">Today's Prompt</span>
  <div class="daily-prompt-hero__card">
    <p class="daily-prompt-hero__text">{{ prompt }}</p>
    <div *ngIf="category || difficulty" class="daily-prompt-hero__meta">
      <span *ngIf="category" class="daily-prompt-hero__badge">{{ category }}</span>
      <span *ngIf="difficulty" class="daily-prompt-hero__badge">{{ difficulty }}</span>
    </div>
  </div>
  <div class="daily-prompt-hero__actions">
    <button class="daily-prompt-hero__btn daily-prompt-hero__btn--accent" (click)="onUsePrompt()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Use Prompt
    </button>
    <button class="daily-prompt-hero__btn daily-prompt-hero__btn--ghost" (click)="onSkip()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="13 17 18 12 13 7"/>
        <polyline points="6 17 11 12 6 7"/>
      </svg>
      Skip
    </button>
  </div>
</div>
