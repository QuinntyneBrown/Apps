<div class="prompt-card">
  <p class="prompt-card__text">{{ prompt }}</p>
  <div *ngIf="badges.length" class="prompt-card__badges">
    <span *ngFor="let badge of badges" class="prompt-card__badge" [ngClass]="'prompt-card__badge--' + badge.color">
      {{ badge.label }}
    </span>
  </div>
  <div class="prompt-card__footer">
    <span *ngIf="usageCount" class="prompt-card__usage">{{ usageCount }}</span>
    <button class="prompt-card__fav" [ngClass]="{ 'prompt-card__fav--active': isFavorite }" (click)="onFavorite()">
      <svg width="16" height="16" viewBox="0 0 24 24" [attr.fill]="isFavorite ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
  </div>
</div>
