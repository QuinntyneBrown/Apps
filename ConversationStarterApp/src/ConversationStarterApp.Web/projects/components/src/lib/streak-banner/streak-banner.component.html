<div class="streak-banner">
  <svg class="streak-banner__icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
  </svg>
  <span class="streak-banner__value">{{ streakCount }} Day Streak!</span>
  <span class="streak-banner__subtitle">{{ subtitle }}</span>
  <div *ngIf="days.length" class="streak-banner__days">
    <div *ngFor="let day of days" class="streak-banner__day" [ngClass]="{ 'streak-banner__day--completed': day.completed }">
      <span>{{ day.label }}</span>
    </div>
  </div>
</div>
