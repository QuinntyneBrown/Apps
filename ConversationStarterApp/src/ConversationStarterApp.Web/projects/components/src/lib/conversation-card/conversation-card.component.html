<div class="conversation-card">
  <div class="conversation-card__top">
    <span class="conversation-card__title">{{ title }}</span>
    <span *ngIf="rating" class="conversation-card__rating">{{ rating }}</span>
  </div>
  <p class="conversation-card__desc">{{ description }}</p>
  <div class="conversation-card__meta">
    <span *ngIf="badgeLabel" class="conversation-card__badge" [ngClass]="'conversation-card__badge--' + badgeColor">
      {{ badgeLabel }}
    </span>
    <span *ngIf="dateMeta" class="conversation-card__date">{{ dateMeta }}</span>
  </div>
</div>
