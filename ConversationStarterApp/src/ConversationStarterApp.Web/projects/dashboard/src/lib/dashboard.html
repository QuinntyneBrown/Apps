<div class="dashboard">
  <lib-daily-prompt-hero
    *ngIf="randomPrompt$ | async as prompt"
    [prompt]="prompt.text"
    [category]="categoryLabels[prompt.category]"
    [difficulty]="depthLabels[prompt.depth]"
    (usePrompt)="usePrompt()"
    (skip)="skipPrompt()">
  </lib-daily-prompt-hero>

  <div class="dashboard__body">
    <div class="dashboard__stats">
      <lib-stat-card value="7" label="Day Streak" color="accent"></lib-stat-card>
      <lib-stat-card value="42" label="Prompts Used" color="primary"></lib-stat-card>
      <lib-stat-card value="15" label="Favorites" color="warning"></lib-stat-card>
    </div>

    <lib-section-header
      title="Recent Conversations"
      linkText="View All"
      linkRoute="/progress">
    </lib-section-header>

    <div class="dashboard__conversations">
      <lib-conversation-card
        *ngFor="let session of recentSessions$ | async"
        [title]="session.title"
        [description]="session.notes || 'No notes'"
        [rating]="session.wasSuccessful ? '5/5' : ''"
        [badgeLabel]="session.duration || ''"
        badgeColor="primary"
        [dateMeta]="(session.startTime | date:'mediumDate') || ''">
      </lib-conversation-card>
    </div>
  </div>
</div>
