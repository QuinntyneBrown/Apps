<div class="progress-page">
  <lib-page-header title="Progress"></lib-page-header>

  <lib-streak-banner
    [streakCount]="7"
    subtitle="Keep talking daily to maintain your streak"
    [days]="streakDays">
  </lib-streak-banner>

  <div class="progress-page__body">
    <div class="progress-page__stats">
      <lib-stat-card value="42" label="Total Prompts" color="primary"></lib-stat-card>
      <lib-stat-card value="4.2" label="Avg Rating" color="accent"></lib-stat-card>
      <lib-stat-card value="18h" label="Total Time" color="success"></lib-stat-card>
    </div>

    <lib-section-header title="Insights"></lib-section-header>

    <div class="progress-page__insights">
      <lib-insight-card
        *ngFor="let insight of insights"
        [title]="insight.title"
        [description]="insight.description"
        [iconColor]="insight.iconColor">
      </lib-insight-card>
    </div>
  </div>
</div>
