<div class="prompts">
  <lib-page-header
    title="Prompts"
    actionLabel="Random Prompt"
    (action)="getRandom()">
  </lib-page-header>

  <div class="prompts__body">
    <div class="prompts__filters">
      <lib-filter-chip
        *ngFor="let filter of filters"
        [label]="filter.label"
        [active]="activeFilter === filter.label"
        (toggle)="onFilterToggle(filter)">
      </lib-filter-chip>
    </div>

    <div class="prompts__list">
      <lib-prompt-card
        *ngFor="let prompt of prompts$ | async"
        [prompt]="prompt.text"
        [badges]="getPromptBadges(prompt)"
        [usageCount]="getUsageText(prompt)"
        [isFavorite]="isFavorite(prompt.promptId)"
        (favorite)="toggleFavorite(prompt)">
      </lib-prompt-card>
    </div>
  </div>
</div>
