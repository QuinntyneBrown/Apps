<div class="step-item" (click)="toggle.emit()">
  <div class="step-item__check" [ngClass]="{'step-item__check--done': checked}">
    <span *ngIf="checked" class="step-item__check-icon material-symbols-rounded">check</span>
  </div>
  <span class="step-item__label" [ngClass]="{'step-item__label--done': checked}">{{ label }}</span>
</div>
