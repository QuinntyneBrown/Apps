<div class="goal-card">
  <div class="goal-card__top">
    <span class="goal-card__title">{{ title }}</span>
    <span *ngIf="priority" class="goal-card__priority" [ngClass]="'goal-card__priority--' + priority">{{ priority | titlecase }}</span>
    <span *ngIf="status === 'completed'" class="goal-card__status goal-card__status--completed">Completed</span>
  </div>
  <div class="goal-card__meta">
    <span *ngIf="category" class="goal-card__category">{{ category }}</span>
    <span *ngIf="targetDate" class="goal-card__date">&bull; Target: {{ targetDate }}</span>
  </div>
  <div *ngIf="progress > 0 && status !== 'completed'" class="goal-card__prog">
    <div class="goal-card__prog-head">
      <span class="goal-card__prog-label">{{ status === 'planning' ? 'Planning' : 'In Progress' }}</span>
      <span class="goal-card__prog-pct">{{ progress }}%</span>
    </div>
    <div class="goal-card__bar">
      <div class="goal-card__bar-fill" [style.width.%]="progress"></div>
    </div>
  </div>
</div>
