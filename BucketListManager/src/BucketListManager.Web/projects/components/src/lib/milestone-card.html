<div class="milestone-card">
  <div class="milestone-card__head">
    <span class="milestone-card__title">{{ title }}</span>
    <span class="milestone-card__badge" [ngClass]="achieved ? 'milestone-card__badge--achieved' : 'milestone-card__badge--progress'">
      {{ achieved ? 'Achieved' : 'In Progress' }}
    </span>
  </div>
  <div class="milestone-card__meta">
    <span *ngIf="category" class="milestone-card__cat">{{ category }}</span>
    <span *ngIf="date" class="milestone-card__date">{{ date }}</span>
  </div>
  <div *ngIf="!achieved && progress > 0" class="milestone-card__bar">
    <div class="milestone-card__bar-fill" [style.width.%]="progress"></div>
  </div>
</div>
