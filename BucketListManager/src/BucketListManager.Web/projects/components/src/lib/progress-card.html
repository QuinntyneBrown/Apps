<div class="progress-card">
  <div class="progress-card__head">
    <span class="progress-card__title">Progress</span>
    <span class="progress-card__pct">{{ progress }}%</span>
  </div>
  <div class="progress-card__bar">
    <div class="progress-card__bar-fill" [style.width.%]="progress"></div>
  </div>
  <div *ngIf="targetDate" class="progress-card__target">
    <span class="progress-card__target-icon material-symbols-rounded">calendar_today</span>
    <span class="progress-card__target-text">Target: {{ targetDate }}</span>
  </div>
</div>
