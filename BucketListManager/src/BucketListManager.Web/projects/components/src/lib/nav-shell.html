<div class="nav-shell">
  <aside class="nav-shell__sidebar">
    <div class="nav-shell__logo">
      <span class="nav-shell__logo-icon material-symbols-rounded">{{ appIcon }}</span>
      <span class="nav-shell__logo-text">{{ appName }}</span>
    </div>
    <nav class="nav-shell__nav">
      <a *ngFor="let item of navItems"
         class="nav-shell__link"
         [ngClass]="{'nav-shell__link--active': item.active}"
         [attr.href]="item.route">
        <span class="nav-shell__link-icon material-symbols-rounded">{{ item.icon }}</span>
        <span class="nav-shell__link-label">{{ item.label }}</span>
      </a>
    </nav>
  </aside>
  <main class="nav-shell__main">
    <ng-content></ng-content>
  </main>
  <nav class="nav-shell__tabbar">
    <a *ngFor="let item of navItems"
       class="nav-shell__tab"
       [ngClass]="{'nav-shell__tab--active': item.active}"
       [attr.href]="item.route">
      <span class="nav-shell__tab-icon material-symbols-rounded">{{ item.icon }}</span>
      <span class="nav-shell__tab-label">{{ item.label }}</span>
    </a>
  </nav>
</div>
