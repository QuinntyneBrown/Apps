<div class="hero-card">
  <span class="hero-card__title">{{ title }}</span>
  <div class="hero-card__stats">
    <div class="hero-card__stat">
      <span class="hero-card__stat-val">{{ totalGoals }}</span>
      <span class="hero-card__stat-label">Total Goals</span>
    </div>
    <div class="hero-card__stat">
      <span class="hero-card__stat-val">{{ completed }}</span>
      <span class="hero-card__stat-label">Completed</span>
    </div>
    <div class="hero-card__stat">
      <span class="hero-card__stat-val">{{ progress }}%</span>
      <span class="hero-card__stat-label">Progress</span>
    </div>
  </div>
  <div class="hero-card__bar">
    <div class="hero-card__bar-fill" [style.width.%]="progress"></div>
  </div>
</div>
